# openh264 is written in C++, so the executable links against three MinGW runtime DLLs:
#   libstdc++-6.dll, libgcc_s_seh-1.dll, libwinpthread-1.dll
# They ship next to the exe (see README.md and tools/package.ps1).
#
# `-C link-arg=-static` WAS TRIED AND REMOVED: libstdc++ stayed dynamic anyway, because the
# linker prefers the import library sitting next to the static archive. That left two copies
# of libgcc in one process — an unsupported mix. Keeping all three dynamic is consistent.
