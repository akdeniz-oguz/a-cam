name: Release

# Publishes a ready-to-run zip so people can download a-Cam without installing Rust.
# Triggered by pushing a tag such as v0.1.0, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Windows runners default to PowerShell, which treats anything a command writes to stderr
# as a failure. rustup and cargo report progress there, so steps fail even when they
# succeeded. Steps that genuinely need PowerShell set `shell: pwsh` themselves.
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: choco install mingw --no-progress -y

      # The host has to be selected here: runners default to MSVC, which would need
      # Visual Studio, and a rust-toolchain.toml cannot pin a host.
      - name: Install the GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu \
            --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # adb, scrcpy-server and the camera source DLL are all embedded into the executable
      # at build time, which is what makes the download a single file. scrcpy therefore
      # has to be on disk before cargo runs.
      - name: Fetch scrcpy
        run: ./tools/fetch-scrcpy.ps1
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        run: cargo build --release

      - name: Check that the build is self-contained
        shell: pwsh
        run: |
          $exe = 'target/release/a-cam.exe'
          $size = (Get-Item $exe).Length / 1MB
          if ($size -lt 15) {
            throw "a-cam.exe is only $([math]::Round($size,1)) MB; the tools were not embedded."
          }
          Copy-Item $exe 'a-Cam.exe'
          Write-Host "a-Cam.exe is $([math]::Round($size,1)) MB"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: a-Cam.exe
          generate_release_notes: true
          body: |
            ## Download

            One file: `a-Cam.exe`. Save it anywhere and run it. Nothing to unpack and
            nothing to install — adb, scrcpy-server and the camera source all travel
            inside it.

            **The phone needs Developer options and USB debugging turned on.** That is how
            a-Cam drives the phone, and it is what lets it work without installing anything
            on the phone itself. Android 12 or newer is required.

            Webcam output needs no separate step: press **Start Stream** and Windows asks
            once for permission to place the camera source. Decline it and the preview
            still works, just without the webcam. Windows 11 is required for that part.
