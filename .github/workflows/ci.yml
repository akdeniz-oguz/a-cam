name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MinGW supplies two things Rust needs here: dlltool, used when linking against
      # system DLLs, and gcc/g++ for the C++ H.264 decoder. Visual Studio is not needed.
      - name: Install MinGW
        run: choco install mingw --no-progress -y

      # The toolchain comes from rust-toolchain.toml and nothing else. Using an action as
      # well would set RUSTUP_TOOLCHAIN, which overrides that file and silently builds
      # with a different host than the project is tested against.
      - name: Install the toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release
