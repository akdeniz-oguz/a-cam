name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The project targets the GNU toolchain, so that building it needs only MinGW and
      # not a Visual Studio install. MinGW supplies two things Rust needs here: dlltool,
      # used when linking against system DLLs, and gcc/g++ for the C++ H.264 decoder.
      - name: Install MinGW
        run: choco install mingw --no-progress -y

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Build
        run: cargo build --workspace --release --target x86_64-pc-windows-gnu
