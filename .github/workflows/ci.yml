name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Windows runners default to PowerShell, which treats anything a command writes to stderr
# as a failure. rustup and cargo report progress there, so steps fail even when they
# succeeded. bash does not do that.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MinGW supplies two things Rust needs here: dlltool, used when linking against
      # system DLLs, and gcc/g++ for the C++ H.264 decoder. Visual Studio is not needed.
      - name: Install MinGW
        run: choco install mingw --no-progress -y

      # The host has to be selected here rather than in a rust-toolchain.toml: that file's
      # `channel` field takes a channel name only and rejects a host triple, and runners
      # default to the MSVC host, which would need Visual Studio.
      - name: Install the GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu \
            --component rustfmt,clippy --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustc --version
          cargo fmt --version

      - uses: Swatinem/rust-cache@v2

      # adb and scrcpy-server are embedded into the executable at build time, so they have
      # to be on disk before cargo runs. Without them the build still succeeds, but the
      # binary is not self-contained and warns about it.
      - name: Fetch scrcpy
        run: ./tools/fetch-scrcpy.ps1
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release
